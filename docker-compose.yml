

services:
  # Python backend server
  fieldtech-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fieldtech-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - fieldtech-network
    restart: unless-stopped

  # Nginx reverse proxy (HTTP only for now)
  nginx:
    image: nginx:alpine
    container_name: fieldtech-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - fieldtech-backend
    networks:
      - fieldtech-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  fieldtech-network:
    driver: bridge

volumes:
  nginx_logs:
